<script>
//<xl>
const X=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const U=s=>s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
const colN=n=>{let r='';while(n>0){const m=(n-1)%26;r=String.fromCharCode(65+m)+r;n=(n-m-1)/26}return r};
const colI=s=>[...s].reduce((a,c)=>a*26+c.charCodeAt(0)-64,0);
const MAXL=5; // 階層は最大6段(0〜5)。Excel出力はC〜F列(4段)まで(G=係数/H=単位/I=人員の列グループ)。5段目以降はF列に寄せる
const XLV=3,EXC_ADD=Math.round(25.25*8*9525); // XLV=Excelに出せる最大階層(0〜3=C〜F列) / EXC_ADD=F列(27.5)とG〜I列(30px)を広げた分(25.25文字×8px)の図形X位置の補正
const R0=8,CL=12,C0=11,EXC=513454,TN0=98,MINR=28,CW=152400,RH=285750; // 工程表: 8行目から明細 / 日付列はL(=12列目)から(元は98日) / 明細は最低28行
async function locate(zip){
 const g=p=>zip.file(p).async('string'),rel=(x,id)=>x.match(new RegExp('<Relationship [^>]*Id="'+id+'"[^>]*>'))[0].match(/Target="([^"]+)"/)[1];
 const wb=await g('xl/workbook.xml'),rid=wb.match(/<sheet [^>]*name="工程表"[^>]*r:id="([^"]+)"/)[1];
 const sp='xl/'+rel(await g('xl/_rels/workbook.xml.rels'),rid).replace(/^\/?(xl\/)?/,'');
 const sx=await g(sp),rl=await g(sp.replace(/([^\/]+)$/,'_rels/$1.rels'));
 const dp='xl/'+rel(rl,sx.match(/<drawing r:id="([^"]+)"/)[1]).replace(/^\.\.\//,'');
 const sh=/<c r="L5"[^>]*t="s"/.test(sx)?1:0;
 return {sp,dp,sx,dx:await g(dp),sh,base:+sx.match(new RegExp('<c r="'+colN(12+sh)+'6"[^>]*><v>(\\d+)'))[1]-25569};
}
async function importXl(zip){
 const L=await locate(zip),f=zip.file('xl/sharedStrings.xml'),NW=/<c r="J7"[^>]*t="inlineStr"[^>]*>\s*<is><t[^>]*>物量/.test(L.sx);
 const ss=f?[...(await f.async('string')).matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m=>U([...m[1].replace(/<rPh[\s\S]*?<\/rPh>/g,'').matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join(''))):[];
  const kvH=c=>{const m=L.sx.match(new RegExp('<c r="'+c+'7"([^>]*?)(?:/>|>([\\s\\S]*?)</c>)'));if(!m)return '';const v=m[2]||'';return /t="s"/.test(m[1])?(ss[+(v.match(/<v>(\d+)/)||[0,-1])[1]]||''):U((v.match(/<t[^>]*>([\s\S]*?)<\/t>/)||[0,''])[1])};
  const KVL=kvH('G').trim()==='係数'&&kvH('H').trim()==='単位'; // G=係数 / H=単位 / I=人員 のレイアウト
  const bars={},CD={};for(const m of L.sx.matchAll(/<c r="([A-Z]+)6"[^>]*>(?:<f>[^<]*<\/f>)?<v>(\d+)<\/v>/g))CD[colI(m[1])]=+m[2]-25569;
 for(const a of L.dx.matchAll(/<xdr:twoCellAnchor>[\s\S]*?<\/xdr:twoCellAnchor>/g)){
  if(!/name="pGr_/.test(a[0]))continue;
  const f=a[0].match(/<xdr:from><xdr:col>(\d+)<\/xdr:col>[\s\S]*?<xdr:row>(\d+)<\/xdr:row>/),t=a[0].match(/<xdr:to><xdr:col>(\d+)</);
  let bs=L.base+ +f[1]-(11+L.sh),bd=Math.max(1,+t[1]- +f[1]);
   if(CD[13+L.sh]&&CD[12+L.sh]&&CD[13+L.sh]-CD[12+L.sh]>1){bs=CD[+f[1]+1];const ee=(CD[+t[1]+1]??CD[+t[1]]+10)-1;bd=Math.max(1,ee-bs+1)}
   bars[+f[2]+1]={s:bs,d:bd};}
 const T=[];
 for(const m of L.sx.matchAll(/<row r="(\d+)"[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g)){
  const r=+m[1];if(r<R0||!m[2])continue;
  let got=0;const kvr={};
  for(const c of m[2].matchAll(/<c r="([C-L])\d+"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
   let v=c[3]||'',tx='';
   if(/t="s"/.test(c[2]))tx=ss[+(v.match(/<v>(\d+)/)||[0,-1])[1]]||'';
   else if(/inlineStr/.test(c[2]))tx=U((v.match(/<t[^>]*>([\s\S]*?)<\/t>/)||[0,''])[1]);
   if(KVL&&'GHI'.includes(c[1])){if(got)kvr[c[1]]=String(tx||(v.match(/<v>([^<]*)<\/v>/)||[])[1]||'').trim();continue}
   if(tx){if(c[1]=='J'&&!NW)continue;if(NW&&c[1]=='L')continue;if(c[1]=='J'||(!NW&&(c[1]=='L'||(c[1]=='K'&&!L.sh)))){if(got)T[T.length-1].q=tx}else if(c[1]=='K'){if(got)T[T.length-1].co=tx}else if(!got){got=1;const b=bars[r]||{};T.push({n:tx,l:'CDEFGHI'.indexOf(c[1]),d:b.d??null,s:b.s??null,p:'',q:'',co:''})}}}
   if(KVL&&got){const t=T[T.length-1];if(kvr.G)t.k=kvr.G+(kvr.H||'');if(kvr.I)t.m=kvr.I}}
 return {T,base:L.base};
}

async function mkKit(zip){
 let st=await zip.file('xl/styles.xml').async('string');
 const blk=(tag,item)=>{const m=st.match(new RegExp('<'+tag+'( [^>]*)?>([\\s\\S]*?)</'+tag+'>'));return {m,items:m?(m[2].match(item)||[]):[]}};
 const B=blk('borders',/<border(?:\s[^>]*)?>[\s\S]*?<\/border>|<border\/>/g),F=blk('fills',/<fill>[\s\S]*?<\/fill>/g),XF=blk('cellXfs',/<xf\b[^>]*?(?:\/>|>[\s\S]*?<\/xf>)/g);
 const cnt=b=>b.m&&+(b.m[1]||'').match(/count="(\d+)"/)?.[1]===b.items.length;
 const ok=cnt(B)&&cnt(F)&&cnt(XF);
 const bl=B.items.slice(),fl=F.items.slice(),xf=XF.items.slice(),ca={};
 const attr=(x,n)=>{const m=x.match(new RegExp(' '+n+'="([^"]*)"'));return m?m[1]:null};
 const setA=(h,n,v)=>new RegExp(' '+n+'="').test(h)?h.replace(new RegExp('( '+n+'=")[^"]*'),'$1'+v):h+` ${n}="${v}"`;
 const headOf=x=>x.match(/^<xf[^>]*/)[0].replace(/\/$/,'');
 const kidsOf=x=>x.endsWith('</xf>')?x.slice(x.indexOf('>')+1,-5):'';
 // 横罫線(上下)をすべて極細(hair)にした書式を返す。keepTop=true なら上罫線は変えない
 const hair=(s,keepTop)=>{if(!ok||s==null)return s;s=+s;const k='h'+s+(keepTop?'t':'');if(k in ca)return ca[k];const x=xf[s];if(!x)return ca[k]=s;
  const b=bl[+attr(x,'borderId')];if(!b)return ca[k]=s;
  let nb=b.replace(/<bottom style="(?!hair")\w+"/,'<bottom style="hair"');if(!keepTop)nb=nb.replace(/<top style="(?!hair")\w+"/,'<top style="hair"');
  if(nb===b)return ca[k]=s;
  let j=bl.indexOf(nb);if(j<0){j=bl.length;bl.push(nb)}
  let h=setA(setA(headOf(x),'borderId',j),'applyBorder',1);xf.push(h+(kidsOf(x)?'>'+kidsOf(x)+'</xf>':'/>'));return ca[k]=xf.length-1};
 // 左(l)・右(r)の縦罫線が極細(hair)なら細線(thin)にした書式を返す(月の切り替わり線用)
 const vb=(s,l,r)=>{if(!ok||s==null||(!l&&!r))return s;s=+s;const k='v'+s+(l?'l':'')+(r?'r':'');if(k in ca)return ca[k];const x=xf[s];if(!x)return ca[k]=s;
  const b=bl[+attr(x,'borderId')];if(!b)return ca[k]=s;
  let nb=b;if(l)nb=nb.replace(/<left style="hair"/,'<left style="thin"');if(r)nb=nb.replace(/<right style="hair"/,'<right style="thin"');
  if(nb===b)return ca[k]=s;
  let j=bl.indexOf(nb);if(j<0){j=bl.length;bl.push(nb)}
  const h=setA(setA(headOf(x),'borderId',j),'applyBorder',1);xf.push(h+(kidsOf(x)?'>'+kidsOf(x)+'</xf>':'/>'));return ca[k]=xf.length-1};
 // 塗り(fill=RRGGBB)・中央寄せ縮小表示を加えた書式
 const mod=(s,fill,ctr)=>{if(!ok||s==null)return s;s=+s;const k='m'+s+'|'+fill+'|'+ctr;if(k in ca)return ca[k];const x=xf[s];if(!x)return ca[k]=s;
  let h=headOf(x),kids=kidsOf(x);
  if(fill){const f=`<fill><patternFill patternType="solid"><fgColor rgb="FF${fill}"/><bgColor indexed="64"/></patternFill></fill>`;let fi=fl.indexOf(f);if(fi<0){fi=fl.length;fl.push(f)}h=setA(setA(h,'fillId',fi),'applyFill',1)}
  if(ctr){kids='<alignment horizontal="center" vertical="center" shrinkToFit="1"/>';h=setA(h,'applyAlignment',1)}
  xf.push(h+(kids?'>'+kids+'</xf>':'/>'));return ca[k]=xf.length-1};
 // 数値書式(formatCode)を差し替えた書式を返す(例: 'General;;' = 0 を表示しない)
 const nfNew=[];let nfNext=0;
 const nf=(s,code)=>{if(!ok||s==null)return s;s=+s;const k='n'+s+'|'+code;if(k in ca)return ca[k];const x=xf[s];if(!x)return ca[k]=s;
  if(!nfNext){nfNext=Math.max(163,...[...st.matchAll(/<numFmt numFmtId="(\d+)"/g)].map(m=>+m[1]))+1}
  let id=nfNew.findIndex(a=>a[1]===code);if(id<0){nfNew.push([nfNext+nfNew.length,code]);id=nfNew.length-1}
  const h=setA(setA(headOf(x),'numFmtId',nfNew[id][0]),'applyNumberFormat',1);xf.push(h+(kidsOf(x)?'>'+kidsOf(x)+'</xf>':'/>'));return ca[k]=xf.length-1};
 const out=()=>{if(!ok)return st;const rb=(m,tag,arr)=>`<${tag} count="${arr.length}"${(m[1]||'').replace(/ count="\d+"/,'')}>${arr.join('')}</${tag}>`;
  let r=st.replace(B.m[0],()=>rb(B.m,'borders',bl)).replace(F.m[0],()=>rb(F.m,'fills',fl)).replace(XF.m[0],()=>rb(XF.m,'cellXfs',xf));
  if(nfNew.length){const add=nfNew.map(a=>`<numFmt numFmtId="${a[0]}" formatCode="${a[1]}"/>`).join('');
   if(/<numFmts[ >]/.test(r))r=r.replace(/<numFmts count="(\d+)"([^>]*)>/,(m,c,o)=>`<numFmts count="${+c+nfNew.length}"${o}>`).replace('</numFmts>',()=>add+'</numFmts>');
   else r=r.replace(/(<styleSheet[^>]*>)/,(m)=>m+`<numFmts count="${nfNew.length}">${add}</numFmts>`)}
  return r};
 return {hair,mod,nf,vb,out,ok};
}
// 係数(G列)・単位(H列)・人員(I列)。係数「20㎥/人日」→ 係数=20 / 単位=㎥/人日(単位は元の文字のまま。㎥がm3に化けないように)
const NUMRE=/[0-9０-９][0-9０-９,，]*(?:[.．][0-9０-９]+)?/;
function kvOf(t){
 const o={},ks=String(t.k??'').trim(),ms=String(t.m??'').trim();
 if(ks){const m=ks.match(NUMRE);
  if(m){o.k=numOf(m[0]);o.u=(ks.slice(0,m.index)+ks.slice(m.index+m[0].length)).trim();
   if(!o.u&&ks===m[0]){try{o.u=unitK(t)}catch(e){}}} // 数値だけのときは、品目マスターの単位を使う
  else o.k=ks}
 if(ms){const n=numOf(ms);o.m=n!=null&&ms.replace(NUMRE,'').replace(/[人名\s]/g,'')===''?n:ms}
 return o}
// ボタンは列幅に引っ張られて伸びるので、元テンプレートの寸法(px)のまま置き直す。
// 元のF〜K列(27×5+85=220px)は、いまのF列(27.5文字=220px)に収まるので、F列内の同じ位置に変換する。改ページ調整ボタンだけJ列(左端〜右端)に置く
const BPX=9525,BCW=j=>j>=5&&j<=9?27:j==10?85:0;
const btnMap=(c,e)=>{if(c<5||c>10)return [c,e];let x=e;for(let j=5;j<c;j++)x+=BCW(j)*BPX;return [5,x]};
async function exportXl(zip,T,o){
 const L=await locate(zip),warn=[],kit=await mkKit(zip);
 const f0=o.f0,TEN=!!o.ten,domD=x=>new Date(x*864e5).getUTCDate();
  let PS=[];if(TEN){const dm=domD(f0),end=f0+Math.max(7,o.n|0)-1;let s=f0-(dm>=20?dm-20:dm>=10?dm-10:dm-1);PS.push(s);
   for(let x=s+1;x<=end;x++){const q=domD(x);if(q==1||q==10||q==20)PS.push(x)}
   const need=PS.length,NN=Math.max(40,need);for(let x=PS[PS.length-1]+1;PS.length<NN;x++){const q=domD(x);if(q==1||q==10||q==20)PS.push(x)}}
  const N=TEN?PS.length:Math.max(TN0,o.n|0),delta=N-TN0,M=Math.max(T.length,MINR),LAST=R0+M-1;
 const isH=t=>t.d==null&&t.s==null&&!t.p;
 const wdOf=k=>new Date((f0+k)*864e5).getUTCDay(),domOf=k=>new Date((f0+k)*864e5).getUTCDate();
 const rows={};
 for(const m of L.sx.match(/<sheetData>([\s\S]*)<\/sheetData>/)[1].matchAll(/<row r="(\d+)"([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g))rows[+m[1]]={at:m[2].replace(/ spans="[^"]*"/,''),inner:m[3]||''};
 const cl=r=>[...rows[r].inner.matchAll(/<c r="([A-Z]+)\d+"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)].map(c=>({ci:colI(c[1]),raw:c[0],s:(c[2].match(/ s="(\d+)"/)||[])[1]}));
 const ren=(raw,n,ci)=>raw.replace(/^<c r="[A-Z]+\d+"/,`<c r="${colN(ci)}${n}"`);
 const sty=s=>s!=null?` s="${s}"`:'';
 const prof=r=>{const a={};cl(r).forEach(c=>a[c.ci]=c.s);return{arr:Array.from({length:TN0},(_,k)=>a[CL+k]),first:a[CL],last:a[CL+TN0-1]}};
 const P={5:prof(5),6:prof(6),7:prof(7),8:prof(8),9:prof(9),35:prof(35),36:prof(36),37:prof(37)};
 const keep=!TEN&&f0===L.base;
 // 日付列の書式: 元の日付と同じなら元の書式(祝日の色など)を残し、日付が変わったら土日だけ色を付け直す
 const offK=k=>!TEN&&(o.cd?!!o.cd(f0+k):(wdOf(k)==0||wdOf(k)==6));
 const gry=s=>s==null?s:kit.mod(s,'C0C0C0',0);
 const ds=(p,k)=>{let s;if(k==N-1)s=p.last;else if(k==0)s=p.first;else if(TEN)s=p.arr[1];else if(keep&&k<TN0-1)s=p.arr[k];else s=offK(k)?p.arr[4]:p.arr[1];return offK(k)?gry(s):s};
 const dsd=(p,k)=>{let s=k==N-1?p.last:k==0?p.first:(TEN?p.arr[1]:(offK(k)?p.arr[4]:p.arr[1]));return offK(k)?gry(s):s};
 const hz=(s,top)=>s==null?s:kit.hair(s,top);
 // 月が替わる列(月初)の境目の縦線を、極細ではなく細線にする(1日・10日表示とも)
 const msK=k=>k>0&&k<N&&domK(k)==1,mb=(s,k)=>kit.vb(s,msK(k),msK(k+1));
 const dayRowD=(n,p,top)=>Array.from({length:N},(_,k)=>`<c r="${colN(CL+k)}${n}"${sty(mb(hz(dsd(p,k),top),k))}/>`).join('');
 const dnp=(p,k)=>k==N-1?p.last:k==0?p.first:p.arr[1]; // 土日祝の色なし
 const dayRowN=(n,p)=>Array.from({length:N},(_,k)=>`<c r="${colN(CL+k)}${n}"${sty(dnp(p,k))}/>`).join('');
 const dayRow=(n,p)=>Array.from({length:N},(_,k)=>`<c r="${colN(CL+k)}${n}"${sty(ds(p,k))}/>`).join('');
 const rowX=(n,at,inner)=>`<row r="${n}"${at}>${inner}</row>`;
 // 旧K列(物量)の左に「施工業者」列を挿入: 旧K→L、旧L以降→+1
 const shc=r=>cl(r);
 const lcl=r=>shc(r).filter(c=>c.ci<CL);
 const lf=(tr,n)=>lcl(tr).map(c=>ren(c.raw,n,c.ci)).join('');
 let out='';
 // 1〜4行目(表題・承認欄): 日付列が増えたら右端の承認欄を右へ移動
 for(let r=1;r<=4;r++)out+=rowX(r,rows[r].at,shc(r).map(c=>r==4&&c.ci==6&&o.pn!=null?`<c r="F4"${sty(c.s)} t="inlineStr"><is><t xml:space="preserve">${X(o.pn)}</t></is></c>`:ren(c.raw,r,c.ci>=92?c.ci+delta:c.ci)).join(''));
 // 5〜7行目(月・日・曜日): 開始日から書き直す
 const dayK=k=>TEN?PS[k]:f0+k,domK=k=>domD(dayK(k)),ser=k=>dayK(k)+25569;let d5='',d6='',d7='';
 for(let k=0;k<N;k++){const cn=colN(CL+k),pn=colN(CL+k-1),v=ser(k);
  // 月見出し: 月の幅(列数)に収まらない場合は「###」になるため、10日表示は文字列「10月」に、収まらない端の月は空欄にする
  if(k==0||domK(k)==1){let sp=1;while(k+sp<N&&domK(k+sp)!=1)sp++;const mo=new Date(dayK(k)*864e5).getUTCMonth()+1,two=mo>=10;
   if(TEN)d5+=sp>=(two?3:2)?`<c r="${cn}5"${sty(P[5].first)} t="inlineStr"><is><t>${mo}月</t></is></c>`:`<c r="${cn}5"${sty(P[5].first)}/>`;
   else d5+=sp>=(two?4:3)?`<c r="${cn}5"${sty(P[5].first)}><f>${cn}6</f><v>${v}</v></c>`:`<c r="${cn}5"${sty(P[5].first)}/>`}
  else d5+=`<c r="${cn}5"${sty(P[5].first)}/>`;
  d6+=(k==0||TEN)?`<c r="${cn}6"${sty(P[6].first)}><v>${v}</v></c>`:`<c r="${cn}6"${sty(P[6].first)}><f>${pn}6+1</f><v>${v}</v></c>`;
  d7+=TEN?`<c r="${cn}7"${sty(ds(P[7],k))} t="inlineStr"><is><t>${'上中下'[domK(k)<10?0:domK(k)<20?1:2]}</t></is></c>`:`<c r="${cn}7"${sty(ds(P[7],k))}><f>${cn}6</f><v>${v}</v></c>`}
 out+=rowX(5,rows[5].at,lf(5,5)+d5)+rowX(6,rows[6].at,lf(6,6)+d6)+rowX(7,rows[7].at,lf(7,7).replace(/<c r="J7"([^>]*?)\/>/,(m,a)=>`<c r="J7"${a} t="inlineStr"><is><t>物量</t></is></c>`).replace(/<c r="([GHI])7"([^>]*?)\/>/g,(m,c,a)=>{const s0=(a.match(/ s="(\d+)"/)||[])[1];return `<c r="${c}7"${sty(s0!=null?kit.mod(s0,null,1):null)} t="inlineStr"><is><t>${{G:'係数',H:'単位',I:'人員'}[c]}</t></is></c>`})+d7);

const isLn=o=>o.t==='line'||o.t==='arrow';
// 日(小数可)⇔ 横位置(px)。月の折りたたみにも追従する
const pxf=d=>{const n=DX.length-1,k=d-F0;if(k<=0)return k*W;if(k>=n)return DX[n]+(k-n)*W;const i=Math.floor(k);return DX[i]+(k-i)*(DX[i+1]-DX[i])};
const dayf=x=>{const n=DX.length-1;if(x<=0)return F0+x/W;if(x>=DX[n])return F0+n+(x-DX[n])/W;let lo=0,hi=n-1;while(lo<hi){const m=(lo+hi+1)>>1;if(DX[m]<=x)lo=m;else hi=m-1}const w=DX[lo+1]-DX[lo];return F0+lo+(w>0?(x-DX[lo])/w:0)};
const geom=o=>({l:pxf(o.x),r:pxf(o.x+o.w),t:o.y,b:o.y+o.h});
const rd=v=>Math.round(v*1000)/1000;
function setGeom(o,l,r,t,b){const x=dayf(l);o.x=rd(x);o.w=rd(dayf(r)-x);o.y=Math.round(t);o.h=Math.round(b-t)}
const getO=id=>OBJ().find(o=>o.id===id),selO=()=>selId?getO(selId):null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const offs=()=>{const a=$q('#bd').getBoundingClientRect(),c=$q('#R').getBoundingClientRect();return{x:a.left-c.left,y:a.top-c.top}};
const blurActive=()=>{const a=document.activeElement;if(a&&a!==document.body&&a.blur&&!(a.id&&a.id.indexOf('oc_')==0))a.blur()};

function cloudPath(l,t,r,b){
 const w=r-l,h=b-t,a=Math.max(10,Math.min(26,Math.min(w,h)/3)),nx=Math.max(1,Math.round(w/a)),ny=Math.max(1,Math.round(h/a)),sx=w/nx,sy=h/ny,rx=sx*.54,ry=sy*.54;
 let d='M'+l+','+t;
 for(let i=1;i<=nx;i++)d+='A'+rx+','+rx+' 0 0 1 '+(l+sx*i)+','+t;
 for(let i=1;i<=ny;i++)d+='A'+ry+','+ry+' 0 0 1 '+r+','+(t+sy*i);
 for(let i=1;i<=nx;i++)d+='A'+rx+','+rx+' 0 0 1 '+(r-sx*i)+','+b;
 for(let i=1;i<=ny;i++)d+='A'+ry+','+ry+' 0 0 1 '+l+','+(b-sy*i);
 return d+'Z'}

function objSvg(o){
 const g=geom(o),l=Math.min(g.l,g.r),r=Math.max(g.l,g.r),t=Math.min(g.t,g.b),b=Math.max(g.t,g.b),w=r-l,h=b-t;
 const sc=isLn(o)?(o.sc||'#333333'):o.sc;
 const st=sc?`stroke="${sc}" stroke-width="${o.sw}" stroke-linejoin="round"${o.ds?` stroke-dasharray="${o.sw*3+3} ${o.sw*2+3}"`:''}`:'stroke="none"';
 const fl=o.fc?`fill="${o.fc}"`:'fill="none"';
 const hs=`fill="none" stroke="transparent" stroke-width="${Math.max(12,o.sw+8)}" style="pointer-events:stroke"`;
 let body='',hit='';
 if(o.t==='cloud'){const d=cloudPath(l,t,r,b);body=`<path d="${d}" ${fl} ${st}/>`;hit=`<path d="${d}" ${hs}/>`}
 else if(o.t==='rect'){const a=`x="${l}" y="${t}" width="${w}" height="${h}"`;body=`<rect ${a} ${fl} ${st}/>`;hit=`<rect ${a} ${hs}/>`}
 else if(o.t==='ellipse'){const a=`cx="${(l+r)/2}" cy="${(t+b)/2}" rx="${w/2}" ry="${h/2}"`;body=`<ellipse ${a} ${fl} ${st}/>`;hit=`<ellipse ${a} ${hs}/>`}
 else if(isLn(o)){let x2=g.r,y2=g.b,head='';
  if(o.t==='arrow'){const a=Math.atan2(g.b-g.t,g.r-g.l),L=Math.max(10,o.sw*4.5),sp=.42;
   head=`<polygon points="${g.r},${g.b} ${g.r-L*Math.cos(a-sp)},${g.b-L*Math.sin(a-sp)} ${g.r-L*Math.cos(a+sp)},${g.b-L*Math.sin(a+sp)}" fill="${sc}" stroke="none"/>`;x2=g.r-Math.cos(a)*L*.8;y2=g.b-Math.sin(a)*L*.8}
  body=`<line x1="${g.l}" y1="${g.t}" x2="${x2}" y2="${y2}" ${st}/>${head}`;hit=`<line x1="${g.l}" y1="${g.t}" x2="${g.r}" y2="${g.b}" ${hs}/>`}
 else{body=`<rect x="${l}" y="${t}" width="${w}" height="${h}" fill="${o.fc||'transparent'}" ${st}/>`}
 let tx='';
 if(o.tx&&!isLn(o)){const ls=String(o.tx).split('\n'),fs=o.fs||14,lh=fs*1.25,isT=o.t==='text',x=isT?l+4:(l+r)/2,y0=isT?t+4+fs*.85:(t+b)/2-(ls.length-1)*lh/2+fs*.35;
  tx=`<text style="font:${fs}px 'Yu Gothic',Meiryo,sans-serif;white-space:pre" fill="${o.tc||'#222222'}" text-anchor="${isT?'start':'middle'}">`+ls.map((s,i)=>`<tspan x="${x}" y="${y0+i*lh}">${esc(s)||' '}</tspan>`).join('')+'</text>'}
 return hit+body+tx}

function handles(o){
 const g=geom(o),hd=(x,y,h,c)=>`<rect class="hd obh" data-h="${h}" x="${x-4}" y="${y-4}" width="8" height="8" fill="#fff" stroke="#2f6fd6" stroke-width="1.5" style="pointer-events:all;cursor:${c}"/>`;
 if(isLn(o))return hd(g.l,g.t,'p1','move')+hd(g.r,g.b,'p2','move');
 const l=Math.min(g.l,g.r),r=Math.max(g.l,g.r),t=Math.min(g.t,g.b),b=Math.max(g.t,g.b),mx=(l+r)/2,my=(t+b)/2;
 return `<rect class="obh" x="${l-2}" y="${t-2}" width="${r-l+4}" height="${b-t+4}" fill="none" stroke="#4c7bd9" stroke-dasharray="4 3" style="pointer-events:none"/>`+
  hd(l,t,'nw','nwse-resize')+hd(mx,t,'n','ns-resize')+hd(r,t,'ne','nesw-resize')+hd(r,my,'e','ew-resize')+hd(r,b,'se','nwse-resize')+hd(mx,b,'s','ns-resize')+hd(l,b,'sw','nesw-resize')+hd(l,my,'w','ew-resize')}

function renderOb(){
 const R=$q('#R'),bd=$q('#bd');if(!R||!bd||typeof SH==='undefined')return;
 let s=$q('#ob');if(!s){s=document.createElementNS(NS,'svg');s.id='ob';R.appendChild(s);bindOb(s)}
 {const f=offs();s.style.left=f.x+'px';s.style.top=f.y+'px'}
 const L=OBJ();let bot=+bd.getAttribute('height')||0;L.forEach(o=>{bot=Math.max(bot,Math.max(o.y,o.y+o.h)+12)});
 s.setAttribute('width',+bd.getAttribute('width')||0);s.setAttribute('height',bot);
 if(selId&&!L.some(o=>o.id===selId))selId=null;
 let html='';L.forEach(o=>{html+=`<g class="o" data-id="${o.id}" style="cursor:move">${objSvg(o)}</g>`});
 const so=selO();if(so)html+=handles(so);
 s.innerHTML=html;syncCtl()}
window.renderOb=renderOb;

function mk(type){
 const o={id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:type,x:0,w:0,y:0,h:0,tx:'',fs:14,tc:'#222222',...TD[type]};
 ['tc','fs'].forEach(k=>{if(DEFO[k]!=null)o[k]=DEFO[k]});
 if(type!=='text')['sc','sw','fc','ds'].forEach(k=>{if(DEFO[k]!=null)o[k]=DEFO[k]});
 return o}
function select(id){if(selId===id)return;selId=id;renderOb()}
function persistOb(){try{persist()}catch(e){}}
function fit(o){
 if(o.t!=='text')return;
 const ls=String(o.tx||'').split('\n'),fs=o.fs||14,lh=fs*1.25,tw=Math.max(0,...ls.map(s=>[...s].reduce((a,c)=>a+(c.charCodeAt(0)>255?fs:fs*.58),0)));
 const g=geom(o),l=Math.min(g.l,g.r),t=Math.min(g.t,g.b),w=Math.abs(g.r-g.l),h=Math.abs(g.b-g.t),nw=Math.max(w,tw+12),nh=Math.max(h,ls.length*lh+8);
 if(nw!==w||nh!==h)setGeom(o,l,l+nw,t,t+nh)}
function delObj(id,rec){if(rec!==false)hist();const L=OBJ(),i=L.findIndex(o=>o.id===id);if(i>=0)L.splice(i,1);if(selId===id)selId=null;persistOb();renderOb()}

// ---- 文字の編集(ダブルクリック / 「文字を編集」) ----
function closeEd(){if(ed){const t=ed.ta;ed=null;t.onblur=null;t.remove()}}
function startEdit(o){
 if(isLn(o)){msg('線・矢印には文字を入れられません');return}
 closeEd();const bd=$q('#bd'),R=$q('#R'),g=geom(o),l=Math.min(g.l,g.r),t=Math.min(g.t,g.b),fs=o.fs||14;
 const w=Math.max(Math.abs(g.r-g.l),90),h=Math.max(Math.abs(g.b-g.t),fs*1.25+12);
 const ta=document.createElement('textarea');ta.className='obtx';ta.value=o.tx||'';
 const f=offs();ta.style.cssText=`left:${f.x+l}px;top:${f.y+t}px;width:${w}px;height:${h}px;font-size:${fs}px;color:${o.tc||'#222'};text-align:${o.t==='text'?'left':'center'}`;
 ta.title='Enterで改行 / Ctrl+Enterまたは外をクリックで確定 / Escでキャンセル';
 R.appendChild(ta);ed={o,ta};const isNew=fresh===o.id;let done=false;
 const fin=ok=>{if(done)return;done=true;const v=ta.value;ed=null;ta.onblur=null;ta.remove();
  if(fresh===o.id)fresh=null;
  if(!ok){if(isNew&&o.t==='text')delObj(o.id,false);else renderOb();return}
  if(o.t==='text'&&!v.trim()){delObj(o.id,!isNew);return}
  if(v!==(o.tx||'')){if(!isNew)hist();o.tx=v;fit(o)}persistOb();renderOb()};
 ta.onblur=()=>fin(true);
 ta.onkeydown=ev=>{ev.stopPropagation();if(ev.key==='Escape'){ev.preventDefault();fin(false)}else if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();fin(true)}};
 setTimeout(()=>{ta.focus();ta.select()},0)}

// ---- 選択・移動・サイズ変更 ----
function bindOb(s){
 s.addEventListener('mousedown',e=>{
  if(e.button!==0||tool)return;
  const hd=e.target.closest('.hd'),g=e.target.closest('.o');if(!hd&&!g)return;
  const id=g?g.dataset.id:selId;blurActive();e.preventDefault();e.stopPropagation();
  const o=getO(id);if(!o)return;
  if(hd){startResize(e,o,hd.dataset.h);return}
  const now=Date.now();
  if(lastId===id&&now-lastT<400){lastT=0;select(id);startEdit(o);return}
  lastId=id;lastT=now;select(id);startMove(e,o)}) }
function track(mv,up){const f=ev=>mv(ev),u=ev=>{removeEventListener('mousemove',f);removeEventListener('mouseup',u);up(ev)};addEventListener('mousemove',f);addEventListener('mouseup',u)}
function startMove(e,o){
 const g0=geom(o),x0=e.clientX,y0=e.clientY;let on=false;
 track(ev=>{const dx=ev.clientX-x0,dy=ev.clientY-y0;
  if(!on){if(Math.abs(dx)+Math.abs(dy)<3)return;on=true;hist()}
  o.x=rd(dayf(g0.l+dx));let ny=g0.t+dy;const top=Math.min(ny,ny+o.h);if(top<0)ny-=top;o.y=Math.round(ny);renderOb()},
  ()=>{if(on){lastT=0;persistOb()}})}
function startResize(e,o,h){
 const bd=$q('#bd'),r0=bd.getBoundingClientRect(),g=geom(o);let on=false;
 track(ev=>{const mx=ev.clientX-r0.left,my=Math.max(0,ev.clientY-r0.top);
  if(!on){on=true;hist()}
  if(isLn(o)){if(h==='p1')setGeom(o,mx,g.r,my,g.b);else setGeom(o,g.l,mx,g.t,my)}
  else{const l=Math.min(g.l,g.r),r=Math.max(g.l,g.r),t=Math.min(g.t,g.b),b=Math.max(g.t,g.b);let L=l,Rr=r,Tt=t,Bb=b;
   if(h.indexOf('w')>=0)L=Math.min(mx,r-6);if(h.indexOf('e')>=0)Rr=Math.max(mx,l+6);if(h.indexOf('n')>=0)Tt=Math.min(my,b-6);if(h.indexOf('s')>=0)Bb=Math.max(my,t+6);
   setGeom(o,L,Rr,Tt,Bb)}
  renderOb()},()=>{if(on)persistOb()})}

// ---- 作図(ツールを選んでグラフ上をドラッグ) ----
function setTool(t){tool=(tool===t)?null:t;document.body.classList.toggle('otool',!!tool);
 document.querySelectorAll('[data-ot]').forEach(b=>b.classList.toggle('on',b.dataset.ot===tool));
 if(tool)msg(`「${NAME[tool]}」を挿入: グラフ上をドラッグして描きます(クリックだけでも既定の大きさで置けます / Escで取消)`);}
const R0=$q('#R');
R0.addEventListener('mousedown',e=>{
 if(!tool||e.button!==0)return;const bd=$q('#bd'),t=e.target;
 if(!(t.closest&&(t.closest('#bd')||t.closest('#ob'))))return;
 e.preventDefault();e.stopPropagation();blurActive();closeEd();
 const r=bd.getBoundingClientRect(),sx=e.clientX-r.left,sy=Math.max(0,e.clientY-r.top),type=tool;let o=null,on=false;
 const place=(mx,my)=>{if(isLn({t:type}))setGeom(o,sx,mx,sy,my);else setGeom(o,Math.min(sx,mx),Math.max(sx,mx),Math.min(sy,my),Math.max(sy,my))};
 track(ev=>{const mx=ev.clientX-r.left,my=Math.max(0,ev.clientY-r.top);
  if(!on){if(Math.hypot(mx-sx,my-sy)<4)return;on=true;hist();o=mk(type);OBJ().push(o);selId=o.id}
  place(mx,my);renderOb()},
  ()=>{swallow=true;setTimeout(()=>{swallow=false},60);
   if(!on){hist();o=mk(type);OBJ().push(o);selId=o.id;const d=DSZ[type];setGeom(o,sx,sx+d[0],sy,sy+d[1]);}
   setTool(null);persistOb();renderOb();
   if(type==='text'){fresh=o.id;startEdit(o)}else msg(`「${NAME[type]}」を挿入しました(線をダブルクリック、またはEnterキーで文字入力 / 枠の■でサイズ変更 / Deleteで削除)`)})},true);
R0.addEventListener('click',e=>{if(swallow){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('mousedown',e=>{if(!selId)return;const t=e.target;if(t.closest&&(t.closest('#ob')||t.closest('#bar')||t.closest('.obtx')))return;selId=null;renderOb()},true);
addEventListener('keydown',e=>{
 const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
 if(e.key==='Escape'){if(tool){setTool(null);msg('図形の挿入をやめました')}else if(selId){selId=null;renderOb()}return}
 if(selId&&(e.key==='Enter'||e.key==='F2')&&!$i('mdl')){const o=selO();if(o&&!isLn(o)){e.preventDefault();startEdit(o)}}
 else if(selId&&(e.key==='Delete'||e.key==='Backspace')&&!$i('mdl')){e.preventDefault();delObj(selId)}
 else if(selId&&/^Arrow/.test(e.key)&&!e.ctrlKey&&!e.metaKey&&!$i('mdl')){const o=selO();if(!o)return;e.preventDefault();hist();const st=e.shiftKey?10:2,g=geom(o);
  if(e.key==='ArrowLeft')o.x=rd(dayf(g.l-st));else if(e.key==='ArrowRight')o.x=rd(dayf(g.l+st));else if(e.key==='ArrowUp')o.y=Math.max(0,o.y-st);else o.y+=st;persistOb();renderOb()}});

// ---- リボン(挿入タブ)の操作 ----
function syncCtl(){
 if(!$i('oc_sc'))return;const o=selO(),d=o||{...TD.cloud,tc:'#222222',fs:14,...DEFO};
 if(d.sc)$i('oc_sc').value=d.sc;$i('oc_scn').checked=!d.sc;
 if(d.fc)$i('oc_fc').value=d.fc;$i('oc_fcn').checked=!d.fc;
 $i('oc_sw').value=String(d.sw);$i('oc_ds').value=String(d.ds?1:0);$i('oc_tc').value=d.tc||'#222222';$i('oc_fs').value=String(d.fs||14);
 ['oc_ed','oc_dup','oc_fr','oc_bk','oc_del'].forEach(id=>{$i(id).disabled=!o});if(o&&isLn(o))$i('oc_ed').disabled=true}
function setProp(p){const o=selO();if(o){hist();Object.assign(o,p);if('fs' in p)fit(o);persistOb();renderOb()}else{Object.assign(DEFO,p);msg('次に挿入する図形の初期設定を変えました(挿入済みの図形は、先に選択してから変えます)')}}
document.querySelectorAll('[data-ot]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.ot)));
$i('oc_sc').onchange=()=>{$i('oc_scn').checked=false;setProp({sc:$i('oc_sc').value})};
$i('oc_scn').onchange=()=>setProp({sc:$i('oc_scn').checked?'':$i('oc_sc').value});
$i('oc_fc').onchange=()=>{$i('oc_fcn').checked=false;setProp({fc:$i('oc_fc').value})};
$i('oc_fcn').onchange=()=>setProp({fc:$i('oc_fcn').checked?'':$i('oc_fc').value});
$i('oc_sw').onchange=()=>setProp({sw:+$i('oc_sw').value});
$i('oc_ds').onchange=()=>setProp({ds:+$i('oc_ds').value});
$i('oc_tc').onchange=()=>setProp({tc:$i('oc_tc').value});
$i('oc_fs').onchange=()=>setProp({fs:+$i('oc_fs').value});
$i('oc_ed').onclick=()=>{const o=selO();if(o)startEdit(o)};
$i('oc_del').onclick=()=>{if(selId)delObj(selId)};
$i('oc_dup').onclick=()=>{const o=selO();if(!o)return;hist();const c=JSON.parse(JSON.stringify(o));c.id='o'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);c.x=rd(dayf(pxf(o.x)+20));c.y=o.y+20;OBJ().push(c);selId=c.id;persistOb();renderOb()};
$i('oc_fr').onclick=()=>{const L=OBJ(),i=L.findIndex(o=>o.id===selId);if(i<0)return;hist();L.push(L.splice(i,1)[0]);persistOb();renderOb()};
$i('oc_bk').onclick=()=>{const L=OBJ(),i=L.findIndex(o=>o.id===selId);if(i<0)return;hist();L.unshift(L.splice(i,1)[0]);persistOb();renderOb()};
renderOb();
})();
</script>
<script>
// ---- 備考欄(「＋」の下): 最初は3行、Enterで行を追加 ----
(function(){
const box=document.getElementById('nt'),NT=()=>SH[cur].nt||(SH[cur].nt=['','','']),MIN=3;
function render(){const a=NT();
 box.innerHTML='<div class="nth">備考<small>Enterで行を追加 / 空の行でBackspaceで削除</small></div>'+a.map((s,i)=>`<div class="ntl"><input class="nl" data-n="${i}" autocomplete="off"></div>`).join('');
 box.querySelectorAll('.nl').forEach((e,i)=>e.value=a[i])}
window.syncNt=function(){const a=NT(),ins=box.querySelectorAll('.nl');if(ins.length!==a.length){render();return}ins.forEach((e,i)=>{if(e!==document.activeElement&&e.value!==a[i])e.value=a[i]})};
const foc=(i,end)=>{const e=box.querySelector(`.nl[data-n="${i}"]`);if(e){e.focus();const p=end?e.value.length:0;try{e.setSelectionRange(p,p)}catch(x){}}};
box.addEventListener('input',e=>{const t=e.target;if(!t.classList.contains('nl'))return;if(!t._h){hist();t._h=1}NT()[+t.dataset.n]=t.value;persist()});
box.addEventListener('focusout',e=>{if(e.target._h)e.target._h=0});
box.addEventListener('keydown',e=>{const t=e.target;if(!t.classList.contains('nl')||e.isComposing||e.keyCode===229)return;
 const a=NT(),i=+t.dataset.n;
 if(e.key==='Enter'){e.preventDefault();hist();const v=t.value,p=t.selectionStart==null?v.length:t.selectionStart;a[i]=v.slice(0,p);a.splice(i+1,0,v.slice(p));persist();render();foc(i+1,false)}
 else if(e.key==='Backspace'&&t.value===''&&a.length>MIN){e.preventDefault();hist();a.splice(i,1);persist();render();foc(Math.max(0,i-1),true)}
 else if(e.key==='ArrowUp'&&i>0){e.preventDefault();foc(i-1,true)}
 else if(e.key==='ArrowDown'&&i<a.length-1){e.preventDefault();foc(i+1,true)}});
render();draw();
})();
</script>
